<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>补全单词 · 阅读练习台</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#" id="home">补全单词<span>READING WORKSPACE</span></a><nav><button data-mode="daily" class="active">日常刷题</button><button data-mode="mock">限时训练</button><button data-mode="wrong">错题重练</button><button data-mode="words">综合复习</button><button data-mode="history">练习记录</button></nav><button id="backup">导出记录</button><label class="import">恢复备份<input id="restore" type="file" accept=".json"></label></header>
<div id="notice" role="status" aria-live="polite"></div>
<div class="layout"><aside><div class="asidehead"><span>文章目录</span><b id="bankCount"></b></div><input id="search" placeholder="搜索标题、日期或来源" aria-label="搜索文章"><select id="order" aria-label="题目排序"><option value="frequency">收录次数：由高到低</option><option value="asc">日期：由早到晚</option><option value="desc">日期：由新到旧</option><option value="original">PDF 原始顺序</option></select><select id="filter" aria-label="筛选文章"><option value="all">全部文章</option><option value="unfinished">未做</option><option value="completed">已完成</option><option value="ready">已校验</option><option value="review">待复核</option><option value="favorite">收藏</option><option value="wrong">错题</option></select><div id="list"></div></aside><main id="main"></main></div>
<script src="bank.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
